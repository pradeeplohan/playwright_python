name: Run Python Playwright Regression Tests

on:
  schedule:
    - cron: "0 2 * * *"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            name: Chrome
          - browser: firefox
            name: Firefox
          - browser: webkit
            name: Safari

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install ${{ matrix.name }}
        run: python -m playwright install --with-deps ${{ matrix.browser }}

      - name: Create reports directory
        run: mkdir -p reports

      - name: Run regression tests
        run: python -m pytest --browser ${{ matrix.browser }} --ignore=aiTests/test_login.py -n 3 -v --html=reports/regression-report.html --self-contained-html

      - name: Upload regression test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-regression-report-${{ matrix.browser }}
          path: reports/regression-report.html
          if-no-files-found: warn
