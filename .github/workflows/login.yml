name: Playwright Login Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  login-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install Firefox
        run: python -m playwright install --with-deps firefox

      - name: Create reports directory
        run: mkdir -p reports

      - name: Run login test
        env:
          LOGIN_USERNAME: ${{ secrets.LOGIN_USERNAME }}
          LOGIN_PASSWORD: ${{ secrets.LOGIN_PASSWORD }}
        run: python -m pytest -v aiTests/test_login.py --html=reports/login-report.html --self-contained-html

      - name: Upload login test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-login-report
          path: reports/login-report.html
          if-no-files-found: warn
